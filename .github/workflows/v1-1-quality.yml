name: release quality

on:
  pull_request:
    branches: [main, staging]
  push:
    branches:
      - main
      - staging
      - chore/v1.2-prepublication-hardening

permissions:
  contents: read

env:
  AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
  AUTH_GOOGLE_ID: ci-google-client
  AUTH_GOOGLE_SECRET: ci-google-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  NEXT_PUBLIC_ENABLE_DEMO_DATA: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e

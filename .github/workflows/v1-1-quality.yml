name: release quality

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
  AUTH_GOOGLE_ID: ci-google-client
  AUTH_GOOGLE_SECRET: ci-google-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  NEXT_PUBLIC_ENABLE_DEMO_DATA: "false"

jobs:
  quality:
    name: code and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: .quality-artifacts
          if-no-files-found: ignore

  browser:
    name: browser, accessibility and PWA
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  database:
    name: migrations, pgTAP and restore
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/run-database-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-quality
          path: .quality-artifacts/database
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.111.0 stop --no-backup || true

  performance:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run quality:build
      - run: npm run performance:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .quality-artifacts/lighthouse
          if-no-files-found: ignore

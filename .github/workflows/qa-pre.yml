name: authenticated PRE QA

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"

concurrency:
  group: authenticated-pre-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-pre:
    if: ${{ vars.QA_PRE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_PRE_STORAGE_STATE_B64: ${{ secrets.QA_PRE_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate QA secret
        run: test -n "$QA_PRE_STORAGE_STATE_B64"
      - run: npm run qa:pre
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-pre-qa-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
